[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shipgate-control-plane"
version = "0.2.0"
description = "Tenant-isolated release governance with approval policies, concurrency control, and verifiable audit logs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1", "pytest-cov>=5,<8"]

[project.scripts]
shipgate = "shipgate.cli:main"

[tool.setuptools.packages.find]
include = ["shipgate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
source = ["shipgate"]
branch = true
